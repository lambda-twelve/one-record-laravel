name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/php-cs-fixer check --diff

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  composer:
    name: Composer validate and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
      - run: composer audit

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12", "13"]
        dependencies: [lowest, highest]
        include:
          - laravel: "12"
            testbench: "^10.0"
          - laravel: "13"
            testbench: "^11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl, pdo_sqlite
          coverage: none
      - name: Pin the Laravel major
        run: composer require --dev --no-update "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}"
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/phpunit --no-coverage

  consumer:
    name: Consumer install into a fresh Laravel application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, openssl, pdo_sqlite, sqlite3
          coverage: none
      - run: tools/consumer-smoke.sh "$GITHUB_WORKSPACE" /tmp/consumer

  tests-mariadb:
    name: Tests (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: db
      DB_USERNAME: db
      DB_PASSWORD: db
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, openssl, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit --no-coverage

  tests-pgsql:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U db"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: db
      DB_USERNAME: db
      DB_PASSWORD: db
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json, openssl, pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit --no-coverage
